[project]
name = "fundforge-agent"
version = "0.1.0"
description = "FundForge LangGraph agent — 基金投资研究工作流"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.1",
    "openai>=3.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
