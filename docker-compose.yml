services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fundforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fundforge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fundforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fundforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      GIN_MODE: ${GIN_MODE:-debug}
      DATABASE_URL: postgres://${POSTGRES_USER:-fundforge}:${POSTGRES_PASSWORD:-fundforge_dev_password}@postgres:5432/${POSTGRES_DB:-fundforge}?sslmode=disable
      COLLECTOR_BASE_URL: http://collector:8000
      FETCH_INTERVAL_MS: ${FETCH_INTERVAL_MS:-500}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata: